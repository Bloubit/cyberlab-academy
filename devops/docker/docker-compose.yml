version: '3.8'

# CyberLab Academy - Development Environment
# docker-compose.yml

services:
  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: builder
    container_name: cyberlab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - cyberlab-network

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      target: production
    container_name: cyberlab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=cyberlab
      - DB_USERNAME=cyberlab
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberlab-network

  # Worker
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/worker/Dockerfile
    container_name: cyberlab-worker
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=cyberlab
      - DB_USERNAME=cyberlab
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberlab-network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: cyberlab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/public:/usr/share/nginx/html/public
    depends_on:
      - frontend
      - backend
    networks:
      - cyberlab-network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: cyberlab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cyberlab
      - POSTGRES_USER=cyberlab
      - POSTGRES_PASSWORD=secret
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlab -d cyberlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberlab-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: cyberlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberlab-network

  # MailHog (Development only)
  mailhog:
    image: mailhog/mailhog
    container_name: cyberlab-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - cyberlab-network

  # Adminer (Development only)
  adminer:
    image: adminer
    container_name: cyberlab-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=dracula
    networks:
      - cyberlab-network

  # Redis Commander (Development only)
  redis-commander:
    image: rediscommander/redis-commander
    container_name: cyberlab-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - cyberlab-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cyberlab-network:
    driver: bridge
