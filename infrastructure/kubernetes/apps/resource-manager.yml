apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-manager
  namespace: cyberlab
  labels:
    app: resource-manager
spec:
  replicas: 5
  selector:
    matchLabels:
      app: resource-manager
  template:
    metadata:
      labels:
        app: resource-manager
    spec:
      serviceAccountName: resource-manager
      containers:
        - name: manager
          image: cyberlab/resource-manager:latest
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lab-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      nodeSelector:
        worker: "true"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
  namespace: cyberlab
  labels:
    app: node-monitor
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      containers:
        - name: monitor
          image: cyberlab/node-monitor:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
