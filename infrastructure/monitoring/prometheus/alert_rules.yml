groups:
  - name: lab_alerts
    rules:
      # Lab Controller Alerts
      - alert: LabControllerDown
        expr: up{job="cyberlab-controller"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Lab Controller is down"
          description: "Lab Controller has been down for more than 1 minute"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10%"

      # Resource Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85%"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High disk usage"
          description: "Disk usage is above 90%"

      # Lab Specific Alerts
      - alert: TooManyRunningLabs
        expr: cyberlab_running_labs > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many running labs"
          description: "More than 50 labs are running"

      - alert: LabCreationFailure
        expr: rate(cyberlab_lab_creation_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lab creation failures"
          description: "Lab creation is failing"

      - alert: LabExpirationHigh
        expr: cyberlab_labs_expiring_soon > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Many labs expiring soon"
          description: "More than 10 labs will expire soon"

      # Security Alerts
      - alert: ContainerEscapeAttempt
        expr: increase(falco_container_escape_attempts_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container escape attempt detected"
          description: "A container escape attempt was detected"

      - alert: ResourceExhaustion
        expr: cyberlab_resource_exhaustion_events > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Resource exhaustion event"
          description: "A resource exhaustion event was detected"

  - name: postgres_alerts
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 1 minute"

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connections"
          description: "PostgreSQL has more than 100 connections"

  - name: redis_alerts
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 90%"
